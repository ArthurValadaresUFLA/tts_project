[project]
name = "tts-project"
version = "0.1.0"
description = "Ferramenta de Text-to-Speech (CLI + Web) que integra bibliotecas de síntese de voz e o Whisper para identificação de idioma."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arthur Valadares Campideli" }]

dependencies = [
    "click>=8.1",
    "flask>=3.0",
    "gTTS>=2.5",
    "pyttsx3>=2.90",
    "langdetect>=1.0.9",
    "openai-whisper>=20231117",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pdoc>=14.5",
    "ruff>=0.6",
]

[project.scripts]
tts = "tts_project.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_project"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/", "docs/"]

[tool.pytest.ini_options]
addopts = "--cov=tts_project --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src/tts_project"]
omit = ["src/tts_project/web/templates/*"]
