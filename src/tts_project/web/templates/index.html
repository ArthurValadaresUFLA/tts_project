<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTS Project</title>
  <!-- Folha de estilo pré-definida (classless), para acelerar o desenvolvimento -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="container">
    <hgroup>
      <h1>TTS Project</h1>
      <p>Converta texto em áudio — cole o texto ou envie um arquivo .txt</p>
    </hgroup>

    <form id="tts-form">
      <label for="text">Texto
        <textarea id="text" name="text" rows="6" placeholder="Digite ou cole o texto aqui..."></textarea>
      </label>

      <label for="text_file">Ou envie um arquivo .txt
        <input type="file" id="text_file" name="text_file" accept=".txt" />
      </label>

      <div class="grid">
        <label for="quality">Qualidade
          <select id="quality" name="quality">
            <option value="low" selected>Baixa (rápida, offline)</option>
            <option value="high">Alta (mais natural, online)</option>
          </select>
        </label>

        <label for="output_format">Formato
          <select id="output_format" name="output_format">
            <option value="mp3" selected>MP3</option>
            <option value="wav">WAV</option>
          </select>
        </label>

        <label for="speed">Velocidade
          <input type="number" id="speed" name="speed" min="0.25" max="2" step="0.05" value="1.0" />
        </label>
      </div>

      <div class="grid">
        <label for="language">Idioma (ex.: pt-BR, en, es)
          <input type="text" id="language" name="language" placeholder="pt-BR" />
        </label>

        <label for="identify_language">
          <input type="checkbox" id="identify_language" name="identify_language" />
          Identificar idioma automaticamente
        </label>
      </div>

      <button type="submit" id="submit-btn">Sintetizar</button>
    </form>

    <section id="progress-section" hidden>
      <p id="status-text">Processando...</p>
      <progress id="progress-bar" value="0" max="100"></progress>
    </section>

    <section id="result-section" hidden>
      <p id="result-text"></p>
      <audio id="audio-player" controls></audio>
    </section>

    <p id="error-text" role="alert" hidden></p>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
